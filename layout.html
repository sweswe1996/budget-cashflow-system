<style>

:root{--navy:#174f78;--ink:#16324a;--muted:#6b7f92;--bg:#f2f7fa;--line:#d8e4eb;--income:#16834a;--expense:#d94747;--transfer:#4267c7}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-width:0;min-height:100%;overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%;font-family:Inter,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;max-width:100%;min-width:0}
.app{width:100%;max-width:980px;min-width:0;margin:0 auto;min-height:100vh;background:#fff;overflow-x:hidden}
.hero{width:100%;padding:20px 24px 17px;background:linear-gradient(135deg,#143f60,#1f6b97);color:#fff}
.hero h1{margin:0;font-size:clamp(1.45rem,3vw,1.9rem)} .hero p{margin:6px 0 0;opacity:.88}
.tabs-wrap{width:100%;padding:14px 18px;background:linear-gradient(135deg,#174f78,#216f9d);position:sticky;top:0;z-index:10;overflow:hidden}
.tabs{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tab{width:100%;min-width:0;border:0;border-radius:999px;padding:13px 8px;color:#fff;background:rgba(5,46,75,.42);font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px;line-height:1.1;text-align:center;white-space:normal;overflow:hidden}
.tab span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.tab.active{background:#fff}.tab[data-flow="Income"].active{color:var(--income)}.tab[data-flow="Expense"].active{color:var(--expense)}.tab[data-flow="Transfer"].active{color:var(--transfer)}
.transfer-arrow-icon{width:20px;height:20px;flex:0 0 20px}
.content{width:100%;min-width:0;padding:16px}
.card{width:100%;min-width:0;border:1px solid #e6eef3;border-radius:18px;padding:22px;background:#fff;overflow:hidden}
.head{display:flex;align-items:center;gap:13px;margin-bottom:22px;min-width:0}.head>div:last-child{min-width:0}
.icon{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.55rem;background:#eef5f9;flex:0 0 50px}
.title{margin:0;font-size:1.25rem}.subtitle{margin:4px 0 0;color:var(--muted);font-size:.93rem}
.theme-Income .title{color:var(--income)}.theme-Expense .title{color:var(--expense)}.theme-Transfer .title,.theme-Transfer .icon{color:var(--transfer)}
.grid{width:100%;min-width:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px}
.field{width:100%;min-width:0}.field.full{grid-column:1/-1}
label{display:block;font-weight:800;margin-bottom:7px;font-size:.92rem}.req:after{content:" *";color:#e33}
input,select,textarea,.note-toggle{width:100%;max-width:100%;min-width:0;min-height:47px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink);outline:none}
input[type="date"]{display:block;width:100%;min-width:0}
textarea{min-height:86px;resize:vertical}
.amount-wrap{width:100%;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:8px}
.note-box{grid-column:1/-1}.transfer-pair{grid-column:1/-1;width:100%;min-width:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px}.transfer-pair .note-box{grid-column:auto}
.note-toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;text-align:left}.note-editor{display:none;margin-top:10px}.note-editor.open{display:block}.note-editor textarea{min-height:104px}
.actions{width:100%;display:flex;gap:10px;justify-content:flex-end;margin-top:23px}.btn{min-width:0;border:0;border-radius:10px;padding:12px 22px;min-height:48px;font-weight:850}.clear{background:#eaf0f4;color:#24435b}.save{color:#fff}.theme-Income .save{background:var(--income)}.theme-Expense .save{background:var(--expense)}.theme-Transfer .save{background:var(--transfer)}
.toast{position:fixed;left:50%;bottom:26px;max-width:calc(100% - 28px);transform:translate(-50%,100px);opacity:0;transition:.2s;background:#153d5a;color:#fff;border-radius:10px;padding:12px 17px;z-index:99}.toast.show{transform:translate(-50%,0);opacity:1}

@media(max-width:720px){
  html{font-size:16px} body{background:#fff}
  .hero{padding:15px 12px 13px}.hero h1{font-size:1.22rem}.hero p{font-size:.78rem}
  .tabs-wrap{position:static;padding:7px}.tabs{gap:6px}
  .tab{min-height:46px;border-radius:11px;padding:7px 4px;gap:4px;font-size:.76rem}
  .tab .transfer-arrow-icon{width:16px;height:16px;flex-basis:16px}
  .content{padding:7px}.card{padding:14px 10px 16px;border-radius:13px;box-shadow:none}
  .head{gap:9px;margin-bottom:16px}.icon{width:42px;height:42px;flex-basis:42px;font-size:1.2rem}.title{font-size:1.03rem}.subtitle{font-size:.76rem}
  .grid{grid-template-columns:1fr;gap:13px}.field.full{grid-column:auto}
  label{font-size:.86rem;margin-bottom:6px}
  input,select,textarea,.note-toggle{min-height:48px;font-size:16px;padding:10px;border-radius:9px}
  .amount-wrap{grid-template-columns:minmax(0,1fr) 76px;gap:6px}
  .transfer-pair{grid-template-columns:1fr;gap:12px}
  .actions{position:sticky;bottom:0;z-index:8;background:#fff;padding:12px 0 4px;margin-top:7px}.btn{flex:1 1 0;width:50%;min-height:50px;padding:11px 8px;font-size:.9rem}
}
@media(max-width:390px){
  .tab{font-size:.68rem}.tab span{white-space:normal}
  .transfer-pair{grid-template-columns:1fr}
  .amount-wrap{grid-template-columns:minmax(0,1fr) 72px}
}


/* Mobile-browser-safe date input */
.field{
  overflow:hidden;
}

input[type="date"]{
  width:100%;
  max-width:100%;
  min-width:0;
  inline-size:100%;
  min-inline-size:0;
  box-sizing:border-box;
  display:block;
  overflow:hidden;
  -webkit-appearance:none;
  appearance:none;
}

input[type="date"]::-webkit-date-and-time-value{
  min-width:0;
  width:100%;
  text-align:left;
}


@media(max-width:720px){
  input[type="date"]{
    width:100% !important;
    max-width:100% !important;
    min-width:0 !important;
    font-size:16px;
    padding-left:10px;
    padding-right:10px;
  }

  .transfer-pair{
    grid-template-columns:1fr !important;
  }

  .transfer-pair .note-box{
    grid-column:auto;
  }
}

</style>
